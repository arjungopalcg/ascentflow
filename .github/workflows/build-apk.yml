name: Build Android APK

# Builds an installable APK on every push to a claude/* branch or main,
# and on demand from the Actions tab. The APK is attached to a pre-release
# so it can be downloaded straight to a phone.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      # Reuse the same debug signing key across builds so a new APK installs
      # as an update over the last one. (The Play Store needs a real upload key.)
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build APK
        run: flutter build apk --release

      # Google sign-in needs the signing key's fingerprints (public values).
      - name: Signing fingerprints
        id: fingerprints
        run: |
          ks="$HOME/.android/debug.keystore"
          ls -la "$HOME/.android" || true
          out=$(keytool -list -v -keystore "$ks" -storepass android 2>&1 || true)
          echo "$out" | grep -E 'Alias|SHA1|SHA256|Keystore type|error' || true
          echo "sha1=$(echo "$out" | grep -m1 'SHA1:' | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "sha256=$(echo "$out" | grep -m1 'SHA256:' | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/AscentFlow-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AscentFlow-apk
          path: dist/*.apk

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: AscentFlow build ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Installable test build from `${{ github.ref_name }}` (${{ github.sha }}).
            On your Android phone: download the APK below, open it, and allow
            "Install unknown apps" for your browser when asked.

            Package: `com.ascentailabs.ascent_flow`
            Signing SHA-1: `${{ steps.fingerprints.outputs.sha1 }}`
            Signing SHA-256: `${{ steps.fingerprints.outputs.sha256 }}`
          files: dist/*.apk
