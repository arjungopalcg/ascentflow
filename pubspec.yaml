name: ascent_flow
description: "Ascent Flow — AI-powered productivity & wellbeing app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Design & Typography
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^15.1.2

  # Storage
  shared_preferences: ^2.5.3


  # Animations
  flutter_animate: ^4.5.2

  # Charts
  fl_chart: ^0.70.2

  # Calendar
  table_calendar: ^3.1.3
  device_calendar: ^4.3.3

  # Audio
  just_audio: ^0.9.43

  # Text / Input
  flutter_quill: ^11.4.0
  speech_to_text: ^7.0.0

  # Media
  image_picker: ^1.1.2

  # Celebrations
  confetti: ^0.8.0

  # Contacts (for Friends/Groups)
  flutter_contacts: ^1.1.9+2

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2

  # Backend
  supabase_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
