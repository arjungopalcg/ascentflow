name: ascent_flow
description: "Ascent Flow — AI-powered productivity & wellbeing app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Design & Typography
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.1.21

  # State Management
  flutter_riverpod: ^2.6.1

  # Storage
  shared_preferences: ^2.5.3

  # Charts
  fl_chart: ^0.70.2

  # Calendar
  table_calendar: ^3.1.3

  # Sharing (summit postcards)
  share_plus: ^13.3.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2

  # Backend
  supabase_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
